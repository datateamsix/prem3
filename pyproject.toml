[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "model-ready-m3"
version = "0.1.0"
description = "PreM3 — a self-learning, autonomous pre-modeling agent for Google Meridian"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
  "google-adk",
  "google-cloud-aiplatform",
  "google-cloud-bigquery",
  "google-cloud-run",
  "google-cloud-tasks",
  "google-cloud-storage",
  "google-cloud-firestore",
  "google-cloud-kms",
  "cryptography",
  "fastapi",
  "uvicorn",
  "clerk-backend-api==6.0.1",
  "stripe==15.5.0",
  "openpyxl>=3.1",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=18",
  "db-dtypes>=1.4",
  "pandas-gbq>=0.26",
  "pydantic>=2.10",
  "pyyaml>=6.0",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "httpx>=0.28",
  "ruff>=0.9",
]
meridian = [
  "google-meridian==1.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.wheel.force-include]
"app/registry/providers/marketing_advertising_providers.v1.json" = "app/registry/providers/marketing_advertising_providers.v1.json"
"app/rules/meridian.yaml" = "app/rules/meridian.yaml"
"app/rules/intelligence_registry.yaml" = "app/rules/intelligence_registry.yaml"
"app/rules/mel_promotion_policy.yaml" = "app/rules/mel_promotion_policy.yaml"
"app/domain/intelligence/data/base_claims.yaml" = "app/domain/intelligence/data/base_claims.yaml"
"app/domain/intelligence/data/promoted_lessons.yaml" = "app/domain/intelligence/data/promoted_lessons.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "gcp: live Google Cloud tests skipped when ADC is unavailable",
  "meridian_eda: tests that import and execute official google-meridian",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["brand/brand-assets"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
