substitutions:
  _TAG: untagged
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/prem3-evaluation-worker:${_TAG}
      - -f
      - deployment/prem3_evaluation_worker/Dockerfile
      - .
images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/prem3-evaluation-worker:${_TAG}
timeout: 1800s
