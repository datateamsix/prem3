  securitySchemes:
    HTTPBearer:
      bearerFormat: JWT
      description: Clerk session token forwarded by the Next.js BFF. prem3-api verifies the session token. Tenant IDs are
        never accepted from the client.
      scheme: bearer
      type: http
info:
  description: Presentation-safe Project, Dataset, upload, Evaluation, catalog, billing, Google connection, import/publish
    governance, Business IQ, Data Foundation, and governed MMM modeling contracts. Clerk session tokens are verified when
    the identity provider is configured. Creating an Evaluation returns 202 Accepted only after durable Cloud Tasks enqueue;
    202 is not ADK completion and not MODEL_READY. Posterior sampling is never autonomous and requires an exact fingerprinted
    FitPlan approval. Tenant identity is never accepted from the client. IMPORT_READY, FOUNDATION_SOURCE_READY, DATA_FOUNDATION_READY,
    MODEL_READY, MODEL_ACCEPTED, and PUBLISH_READY are distinct deterministic states.
  summary: PreM3 authenticated product API
  title: prem3-api
  version: 0.1.0
