  securitySchemes:
    HTTPBearer:
      bearerFormat: JWT
      description: Clerk session token forwarded by the Next.js BFF. prem3-api verifies the session token. Tenant IDs are
        never accepted from the client.
      scheme: bearer
      type: http
info:
  description: Presentation-safe Project, Dataset, upload, Evaluation, catalog, billing, Google connection, import/publish
    governance, Business IQ, and Data Foundation contracts. Clerk session tokens are verified when the identity provider is
    configured. Creating an Evaluation returns 202 Accepted for resource creation only; durable ADK dispatch is not started
    from this HTTP boundary. Tenant identity is never accepted from the client. IMPORT_READY, FOUNDATION_SOURCE_READY, DATA_FOUNDATION_READY,
    MODEL_READY, and PUBLISH_READY are distinct deterministic states.
  summary: PreM3 authenticated product API
  title: prem3-api
  version: 0.1.0
openapi: 3.1.0
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: Successful Response
      summary: Get Health
      tags:
      - health
